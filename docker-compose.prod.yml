services:
    db:
        image: postgres:16-alpine
        container_name: alentapp-db
        environment:
            - POSTGRES_USER=appuser
            - POSTGRES_DB=appdb
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - '${DB_PORT}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U appuser -d appdb']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1G
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    api:
        build:
            context: .
            dockerfile: packages/api/Dockerfile.prod
        container_name: alentapp-api
        environment:
            - DATABASE_URL=postgres://appuser:${DB_PASSWORD}@db:5432/appdb
            - PORT=${API_PORT}
        ports:
            - '${API_PORT}:${API_PORT}'
            - '9464:9464'
        networks:
            - app-network
            - web-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - "no-new-privileges:true"
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: .
            dockerfile: packages/web/Dockerfile.prod
            args:
                - VITE_API_URL=${VITE_API_URL}
        container_name: alentapp-web
        ports:
            - '${WEB_PORT}:80' # externo:interno, Santi lo definió 80
        networks:
            - web-network
        environment:
            - PORT=${WEB_PORT}
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - "no-new-privileges:true"
        read_only: true
        tmpfs:
            - /var/cache/nginx
            - /var/cache/nginx/client_temp
            - /var/cache/nginx/proxy_temp
            - /var/cache/nginx/fastcgi_temp
            - /var/cache/nginx/uwsgi_temp
            - /var/cache/nginx/scgi_temp
            - /var/run
            - /tmp
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
        depends_on:
            api:
                condition: service_healthy

    prometheus:
        image: prom/prometheus:latest
        container_name: alentapp-prometheus
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        ports:
            - '9090:9090'
        networks:
            - app-network
        depends_on:
            - api
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3" 

    grafana:
        image: grafana/grafana:latest
        container_name: alentapp-grafana
        ports:
            - '3003:3000'
        networks:
            - app-network
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=admin
        volumes:
            - grafana-data:/var/lib/grafana
        depends_on:
            - prometheus
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"                      

networks:
    app-network:
        driver: bridge
    web-network:
        driver: bridge

volumes:
    pgdata:
    grafana-data:
