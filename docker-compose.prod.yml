services:
    db:
        image: postgres:16-alpine
        container_name: alentapp-db
        environment:
            - POSTGRES_USER=appuser
            - POSTGRES_DB=appdb
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - '${DB_PORT}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U appuser -d appdb']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1G
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    api:
        build:
            context: .
            dockerfile: packages/api/Dockerfile.prod
        container_name: alentapp-api
        environment:
            - DATABASE_URL=postgres://appuser:${DB_PASSWORD}@db:5432/appdb
            - PORT=${API_PORT}
        ports:
            - '${API_PORT}:${API_PORT}'
        networks:
            - app-network
            - web-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - "no-new-privileges:true"
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: .
            dockerfile: packages/web/Dockerfile.prod
        container_name: alentapp-web
        ports:
            - '${WEB_PORT}:80' # externo:interno, Santi lo definió 80
        networks:
            - web-network
        environment:
            - PORT=${WEB_PORT}
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - "no-new-privileges:true"
        read_only: true
        tmpfs:
            - /var/cache/nginx
            - /var/run
            - /tmp
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        depends_on:
            api:
                condition: service_healthy

networks:
    app-network:
        driver: bridge
    web-network:
        driver: bridge

volumes:
    pgdata: